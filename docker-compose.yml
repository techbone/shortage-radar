# Shortage Radar services. Zetaris and Nightshift run on the host, outside this file.
#   docker compose up -d hospital-db
services:
  hospital-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    ports:
      # Published on the host so Zetaris's containers reach it at host.docker.internal:5433.
      - "5433:5432"
    volumes:
      - ./db/hospital:/docker-entrypoint-initdb.d:ro
      - hospital-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d hospital"]
      interval: 5s
      retries: 10

volumes:
  hospital-data:
